# Konfigurasi Nginx Reverse Proxy + HTTPS untuk SI-PAKAINGE MONSA
# Ganti lapor.sdnungmongisidi1.sch.id dengan domain resmi sekolah Anda,
# lalu jalankan: sudo certbot --nginx -d lapor.sdnungmongisidi1.sch.id

# Opsional: aktifkan di blok http {} /etc/nginx/nginx.conf jika ingin rate limit lapis proxy:
# limit_req_zone $binary_remote_addr zone=monsa_api:10m rate=15r/s;

server {
    listen 80;
    server_name lapor.sdnungmongisidi1.sch.id;
    server_tokens off;

    # Selaras dengan batas 2.5 MB JSON di backend (foto & pesan suara terkompresi)
    client_max_body_size 3M;

    # Header keamanan browser
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "microphone=(self), camera=(self)" always;
    # HSTS: hanya disimpan browser bila halaman diakses via HTTPS (setelah certbot).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        # limit_req zone=monsa_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
